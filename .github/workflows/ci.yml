
name: FraudLens AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  test:
    name: Python Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run all pytest tests
        env:
          PYTHONPATH: src
          FRAUDLENS_API_KEY: fraudlens-ci-test-key
        run: |
          python -m pytest tests/ -v

  docker:
    name: Authenticated Docker Smoke Tests
    runs-on: ubuntu-latest
    needs: test

    env:
      FRAUDLENS_API_KEY: fraudlens-ci-test-key
      FRAUDLENS_API_URL: http://127.0.0.1:8001

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install smoke test dependencies
        run: |
          pip install httpx python-dotenv

      - name: Build Docker image
        run: |
          docker build -t fraudlens-ai:ci .

      - name: Start secured Docker container
        run: |
          docker run -d \
            --name fraudlens-ci-test \
            -e FRAUDLENS_API_KEY \
            -p 127.0.0.1:8001:8000 \
            fraudlens-ai:ci

      - name: Run authenticated smoke tests
        run: |
          python scripts/docker_smoke_test.py

      - name: Show Docker logs on failure
        if: failure()
        run: |
          docker logs fraudlens-ci-test || true

      - name: Clean up Docker container
        if: always()
        run: |
          docker rm -f fraudlens-ci-test || true
