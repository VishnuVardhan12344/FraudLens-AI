
name: FraudLens AI CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Full Python Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Run all Python tests
        env:
          PYTHONPATH: src
        run: |
          python -m pytest tests/ -v

  docker:
    name: Docker Build and Smoke Tests
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install smoke-test dependency
        run: |
          python -m pip install httpx

      - name: Build Docker image
        run: |
          docker build -t fraudlens-ai:ci .

      - name: Start Docker container
        run: |
          docker run -d \
            --name fraudlens-ci-test \
            -p 127.0.0.1:8001:8000 \
            fraudlens-ai:ci

      - name: Run Docker smoke tests
        run: |
          python scripts/docker_smoke_test.py

      - name: Show Docker logs if a step fails
        if: failure()
        run: |
          docker logs fraudlens-ci-test || true

      - name: Clean up Docker container
        if: always()
        run: |
          docker rm -f fraudlens-ci-test || true
